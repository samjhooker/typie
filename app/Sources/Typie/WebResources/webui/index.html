<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typie</title>
    <script>
      // surface JS errors in the native log instead of a silent blank window
      window.addEventListener('error', function (e) {
        try {
          window.webkit?.messageHandlers.typie.postMessage({
            type: 'log',
            message: 'error: ' + (e.message || e.error) + ' @ ' + (e.filename || '') + ':' + e.lineno,
          })
        } catch {}
      })
      window.addEventListener('unhandledrejection', function (e) {
        try {
          window.webkit?.messageHandlers.typie.postMessage({
            type: 'log',
            message: 'rejection: ' + e.reason,
          })
        } catch {}
      })
    </script>
